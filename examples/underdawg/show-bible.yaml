# UNDERDAWG - worked example show bible (text only).
# This is how the UNDERDAWG origin series was set up. Watch it: https://danielgauerke.com/big-dog
# No reference images or voice are shipped: bring your own art into refs/ (or run
# `python3 -m mdk refs examples/underdawg`) and paste your own ElevenLabs voice id.

series:
  title: "UNDERDAWG"
  logline: "A runt bulldog pup goes down the mine on a bet that he will quit by sundown, and spends a lifetime proving them wrong."
  narrator: "The hero, old and weathered, telling his own legend straight to camera. The past plays as flashback under his voice."
  tone: "Gritty, warm, a little mythic. Real craft shown correctly, legend-scale staging. Entertainment first."
  format:
    aspect_ratio: "9:16"
    max_seconds: 59
    shots_per_episode: 7
    ending: "Mandatory cliffhanger: an unresolved image and a narrator line that opens a question and defers it."

style:
  look: "Photoreal live-action cinematic, industrial, volumetric light, moody, realistic textured fur, film grain"
  global_negative:
    - "no humans, no people, no human faces, no human hands; every character is a bulldog"
    - "no on-screen text, no captions, no letters, no logos, no watermark"
    - "no split screen, no montage inside one frame"
    - "no cartoon, no 3D-animated toy look, no cel shading"
    - "no dogs on all fours; every bulldog is bipedal, standing upright on two legs"
    - "no extra legs, no third arm, no duplicated limbs, no malformed anatomy"
    - "no smoking, no cigars, no cigarettes, nothing in any mouth"
    - "no glowing eyes, no blue eyes"

characters:
  - id: hero
    name: "Big Dog"
    description: "an anthropomorphic English bulldog who stands and works upright on two legs, tools held in his paws"
    constant_traits: "tan and cream coat, heavy jowls, wrinkled muzzle, natural dark brown eyes, brass headlamp; working-class dignity"
    eras:
      - id: pup
        look: "a PUPPY: oversized round head, small stubby body, baby face, still standing upright; oversized coal-dusted canvas jacket, yellow hard hat with headlamp"
        ref: refs/hero-pup.png
      - id: present
        look: "old and wise, grey around the muzzle, brown work jacket, headlamp pushed up, in a dark room lit by a warm lamp, facing camera"
        ref: refs/hero-present.png
  - id: crew
    name: "the old crew"
    description: "grizzled adult bulldog miners, bipedal, wrinkled muzzles and jowls, yellow hard hats with headlamps, dirty canvas jackets"
    eras:
      - id: pit
        look: "coal-black from the shift, tired, tough"
        ref: refs/crew-pit.png

locations:
  - id: pit
    description: "a low underground coal mine tunnel, timber supports, black coal ribs, a solid rock roof"
    lighting: "lit ONLY by headlamps and a few hung mine lamps; no daylight, no sky, no light from above"
  - id: narrator_room
    description: "a dark quiet room, a desk, a warm lamp"
    lighting: "one warm lamp from the side"

voice:
  provider: elevenlabs
  voice_id: "REPLACE_WITH_YOUR_ELEVENLABS_VOICE_ID"
  model_id: eleven_v3
  stability: 0.5
  similarity_boost: 0.75
  style: 0.5
  use_speaker_boost: true
  pronunciations: {}

rules:
  image:
    - "Every figure in frame is explicitly a bulldog with a wrinkled muzzle and jowls, including background and partly hidden figures; anything vague turns human."
    - "Every prop a character touches is in the still; the video model will not add it later."
    - "Scale is stated: the bulldog is human-sized next to equipment."
  video:
    # Video models drift characters onto all fours unless the stance is restated in the motion prompt.
    - "Every bulldog stays upright on two legs from the first frame to the last, never drops to all fours."
    - "Calm, controlled, natural motion; no morphing, no character turning into another."
  voice:
    - "Spread three or four emotional tags through a long line, at the emotional shifts, not one tag at the start."
  story:
    - "Real craft words used correctly: the back is the roof, the ribs are the side walls, the face is the working end."

production:
  backend: openrouter
  text_model: google/gemini-2.5-flash
  image_model: google/gemini-2.5-flash-image
  video_model: google/veo-3.1-lite
  video_resolution: 720p
  higgsfield_image_model: nano_banana_pro
  higgsfield_video_model: veo3_1_lite
  max_rerolls: 2
  max_slowdown: 1.25
  elevenlabs_usd_per_1k_chars: 0.30
  output_width: 1080
  output_height: 1920
